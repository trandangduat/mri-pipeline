schema_version: 1
pipeline_id: fastsurfer_volumetrics
display_name: FastSurfer - Volumetrics
pipeline_version: 2.0.0
description: Mirrors the current MRI Pipeline preset 'FastSurfer + Volume'. Dependencies use a safe file-level DAG so
  independent stages can be scheduled concurrently when resources allow.
status: draft
metadata:
  validated: false
  source: mri_pipeline_current_presets
  processing_engine: fastsurfer
  feature_set: volumetrics
  pipeline_mode: FastSurfer + Volume
  default_profile_set: fastsurfer_volumetrics_default
  required_outputs:
  - cortical_volume
  - subcortical_volume
  optional_outputs:
  - intermediate_work_products
  active_pipeline_stages:
  - reorientation
  - segmentation
  - stats_extraction
  skipped_pipeline_stages:
  - brain_extraction
  - template_registration
  - bias_correction
  - white_matter_segmentation
  - surface_reconstruction
  - surface_registration
  stage_options:
    command_template: mri_pipeline_executor
    input_placeholder: '{input}'
    output_placeholder: '{output}'
    workspace_placeholder: '{workspace_id}'
stages:
- id: reorient_resize
  display_name: Reorientation and Resize
  operation: reorientation_resize
  implementation: fastsurfer_reorientation
  implementation_version: 2.4.2
  enabled: true
  depends_on: []
  execution_configurations:
  - id: cpu_1
    mode: cpu
    cpu_threads: 1
    profile_ref: fastsurfer_volumetrics_default_reorient_resize_cpu_1
    metadata:
      executor: cpu
      pipeline_stage: reorientation
      pipeline_tool_key: fastsurfer_reorientation
      docker_image: duattran05/mri-fastsurfervinn:latest
      provisional: true
  - id: cpu_2
    mode: cpu
    cpu_threads: 2
    profile_ref: fastsurfer_volumetrics_default_reorient_resize_cpu_2
    metadata:
      executor: cpu
      pipeline_stage: reorientation
      pipeline_tool_key: fastsurfer_reorientation
      docker_image: duattran05/mri-fastsurfervinn:latest
      provisional: true
  - id: cpu_4
    mode: cpu
    cpu_threads: 4
    profile_ref: fastsurfer_volumetrics_default_reorient_resize_cpu_4
    metadata:
      executor: cpu
      pipeline_stage: reorientation
      pipeline_tool_key: fastsurfer_reorientation
      docker_image: duattran05/mri-fastsurfervinn:latest
      provisional: true
  metadata:
    pipeline_stage: reorientation
    pipeline_tool_key: fastsurfer_reorientation
    pipeline_stage_order: 1
    docker_image: duattran05/mri-fastsurfervinn:latest
    needs_license: true
    output_files: []
    output_globs:
    - freesurfer/*/mri/orig.mgz
- id: subcortical_segmentation
  display_name: Subcortical Segmentation
  operation: subcortical_segmentation
  implementation: fastsurfer_segmentation
  implementation_version: 2.4.2
  enabled: true
  depends_on:
  - reorient_resize
  execution_configurations:
  - id: gpu_default
    mode: gpu
    cpu_threads: 2
    profile_ref: fastsurfer_volumetrics_default_subcortical_segmentation_gpu_default
    metadata:
      executor: gpu
      pipeline_stage: segmentation
      pipeline_tool_key: fastsurfer_segmentation
      docker_image: duattran05/mri-fastsurfervinn:latest
      provisional: true
    gpu:
      required: true
      minimum_memory_mib: 4096
      device_classes:
      - generic_cuda
      exclusive: true
  - id: cpu_1
    mode: cpu
    cpu_threads: 1
    profile_ref: fastsurfer_volumetrics_default_subcortical_segmentation_cpu_1
    metadata:
      executor: cpu
      pipeline_stage: segmentation
      pipeline_tool_key: fastsurfer_segmentation
      docker_image: duattran05/mri-fastsurfervinn:latest
      provisional: true
  - id: cpu_2
    mode: cpu
    cpu_threads: 2
    profile_ref: fastsurfer_volumetrics_default_subcortical_segmentation_cpu_2
    metadata:
      executor: cpu
      pipeline_stage: segmentation
      pipeline_tool_key: fastsurfer_segmentation
      docker_image: duattran05/mri-fastsurfervinn:latest
      provisional: true
  - id: cpu_4
    mode: cpu
    cpu_threads: 4
    profile_ref: fastsurfer_volumetrics_default_subcortical_segmentation_cpu_4
    metadata:
      executor: cpu
      pipeline_stage: segmentation
      pipeline_tool_key: fastsurfer_segmentation
      docker_image: duattran05/mri-fastsurfervinn:latest
      provisional: true
  metadata:
    pipeline_stage: segmentation
    pipeline_tool_key: fastsurfer_segmentation
    pipeline_stage_order: 2
    docker_image: duattran05/mri-fastsurfervinn:latest
    needs_license: true
    output_files: []
    output_globs:
    - freesurfer/*/mri/aseg.auto.mgz
- id: statistics_atlas_mapping
  display_name: Statistics and Atlas Mapping
  operation: statistics_atlas_mapping
  implementation: fastsurfer_volume_stats_extraction
  implementation_version: 2.4.2
  enabled: true
  depends_on:
  - subcortical_segmentation
  execution_configurations:
  - id: cpu_1
    mode: cpu
    cpu_threads: 1
    profile_ref: fastsurfer_volumetrics_default_statistics_atlas_mapping_cpu_1
    metadata:
      executor: cpu
      pipeline_stage: stats_extraction
      pipeline_tool_key: fastsurfer_volume_stats_extraction
      docker_image: duattran05/mri-fastsurfervinn:latest
      provisional: true
  - id: cpu_2
    mode: cpu
    cpu_threads: 2
    profile_ref: fastsurfer_volumetrics_default_statistics_atlas_mapping_cpu_2
    metadata:
      executor: cpu
      pipeline_stage: stats_extraction
      pipeline_tool_key: fastsurfer_volume_stats_extraction
      docker_image: duattran05/mri-fastsurfervinn:latest
      provisional: true
  - id: cpu_4
    mode: cpu
    cpu_threads: 4
    profile_ref: fastsurfer_volumetrics_default_statistics_atlas_mapping_cpu_4
    metadata:
      executor: cpu
      pipeline_stage: stats_extraction
      pipeline_tool_key: fastsurfer_volume_stats_extraction
      docker_image: duattran05/mri-fastsurfervinn:latest
      provisional: true
  metadata:
    pipeline_stage: stats_extraction
    pipeline_tool_key: fastsurfer_volume_stats_extraction
    pipeline_stage_order: 3
    docker_image: duattran05/mri-fastsurfervinn:latest
    needs_license: true
    output_files:
    - cortical_volume.tsv
    - subcortical_volume.tsv
    output_globs:
    - freesurfer/*/stats/aparc.DKTatlas+aseg.deep.stats
    - freesurfer/*/stats/aseg.stats
    - stats/*.tsv
