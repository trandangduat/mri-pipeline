name: Package Windows

on:
  push:
    branches-ignore:
      - packaging/release-hardening-wip
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    name: Build unsigned Windows NSIS test installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create Python virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip

      - name: Build Windows package
        shell: pwsh
        env:
          CI: true
          NEUROFLOW_TAURI_BUNDLES: nsis
        run: |
          powershell -ExecutionPolicy Bypass -File .\packaging\windows\build-app.ps1 -ProjectRoot $PWD

      - name: Stage NSIS installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "tauri-app\src-tauri\target\release\bundle\nsis" -Filter "*.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $installer) {
            throw "NSIS installer not found under tauri-app\src-tauri\target\release\bundle\nsis"
          }
          New-Item -ItemType Directory -Path "dist-release" -Force | Out-Null
          $output = Join-Path $PWD "dist-release\NeuroFlow-Windows-x64-${{ github.sha }}.exe"
          Copy-Item $installer.FullName $output -Force
          (Get-FileHash -Algorithm SHA256 $output).Hash.ToLowerInvariant() + "  " + [System.IO.Path]::GetFileName($output) | Set-Content -NoNewline "$output.sha256"

      - name: Upload unsigned NSIS test installer
        uses: actions/upload-artifact@v4
        with:
          name: NeuroFlow-Windows-x64-unsigned-test-${{ github.sha }}
          path: |
            dist-release/NeuroFlow-Windows-x64-${{ github.sha }}.exe
            dist-release/NeuroFlow-Windows-x64-${{ github.sha }}.exe.sha256
          if-no-files-found: error
          retention-days: 14
