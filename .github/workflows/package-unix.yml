name: Package Linux and macOS

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-unix:
    name: Build unsigned ${{ matrix.label }} package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
            platform: linux
            architecture: x64
            bundle: appimage
            artifact: NeuroFlow-Linux-x64
          - label: macOS Intel
            os: macos-13
            platform: macos
            architecture: x64
            bundle: dmg
            artifact: NeuroFlow-macOS-x64
          - label: macOS Apple Silicon
            os: macos-14
            platform: macos
            architecture: arm64
            bundle: dmg
            artifact: NeuroFlow-macOS-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create Python virtual environment
        run: |
          python3 -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip

      - name: Build package
        env:
          CI: true
          NEUROFLOW_TAURI_BUNDLES: ${{ matrix.bundle }}
        run: |
          chmod +x ./packaging/${{ matrix.platform }}/build-backend.sh ./packaging/${{ matrix.platform }}/build-app.sh
          ./packaging/${{ matrix.platform }}/build-app.sh "$PWD"

      - name: Stage native distribution file
        run: |
          mkdir -p dist-release
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            source_file="$(find tauri-app/src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
            extension="AppImage"
          else
            source_file="$(find tauri-app/src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
            extension="dmg"
          fi
          if [[ -z "$source_file" || ! -f "$source_file" ]]; then
            echo "Expected ${{ matrix.bundle }} distribution was not produced." >&2
            find tauri-app/src-tauri/target/release/bundle -maxdepth 3 -type f -print >&2 || true
            exit 1
          fi
          output="dist-release/${{ matrix.artifact }}-${{ github.sha }}.$extension"
          cp "$source_file" "$output"
          shasum -a 256 "$output" > "$output.sha256"
          ls -lh "$output" "$output.sha256"

      - name: Upload unsigned native test artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-unsigned-test-${{ github.sha }}
          path: dist-release/${{ matrix.artifact }}-${{ github.sha }}.*
          if-no-files-found: error
          retention-days: 14
