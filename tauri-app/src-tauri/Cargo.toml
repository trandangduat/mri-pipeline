[package]
name = "mri-pipeline-tauri"
version = "0.1.0"
description = "MRI Pipeline desktop shell"
authors = ["MRI Pipeline"]
edition = "2021"

[lib]
name = "mri_pipeline_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mri-pipeline-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
