name: Package Linux and macOS

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-unix:
    name: Build ${{ matrix.label }} package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
            platform: linux
            artifact: NeuroFlow-Linux
          - label: macOS
            os: macos-latest
            platform: macos
            artifact: NeuroFlow-macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create Python virtual environment
        run: |
          python3 -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip

      - name: Build package
        run: |
          chmod +x ./packaging/${{ matrix.platform }}/build-backend.sh ./packaging/${{ matrix.platform }}/build-app.sh
          ./packaging/${{ matrix.platform }}/build-app.sh "$PWD"

      - name: Assemble portable package
        run: |
          mkdir -p "dist-portable/${{ matrix.platform }}"
          portable_dir="dist-portable/${{ matrix.platform }}/NeuroFlowPortable"
          rm -rf "$portable_dir"
          mkdir -p "$portable_dir/config" "$portable_dir/outputs/jobs" "$portable_dir/logs" "$portable_dir/licenses"

          release_dir="tauri-app/src-tauri/target/release"
          if [ -x "$release_dir/NeuroFlow" ]; then
            app_exe="$release_dir/NeuroFlow"
          elif [ -x "$release_dir/mri-pipeline-tauri" ]; then
            app_exe="$release_dir/mri-pipeline-tauri"
          else
            echo "Could not find Tauri executable under $release_dir" >&2
            find "$release_dir" -maxdepth 2 -type f -print >&2
            exit 1
          fi

          cp "$app_exe" "$portable_dir/NeuroFlow"
          chmod +x "$portable_dir/NeuroFlow"
          cp -R "tauri-app/src-tauri/backend" "$portable_dir/backend"
          chmod +x "$portable_dir/backend/neuroflow-backend"

          bundle_dir="$release_dir/bundle"
          if [ -d "$bundle_dir" ]; then
            cp -R "$bundle_dir" "$portable_dir/bundle"
          fi

          tar -czf "dist-portable/${{ matrix.platform }}/${{ matrix.artifact }}-${{ github.sha }}.tar.gz" \
            -C "dist-portable/${{ matrix.platform }}" \
            NeuroFlowPortable
          ls -lh "dist-portable/${{ matrix.platform }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: dist-portable/${{ matrix.platform }}/${{ matrix.artifact }}-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14
