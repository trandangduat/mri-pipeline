schema_version: 1
pipeline_id: freesurfer7_volumetrics
display_name: FreeSurfer 7 - Volumetrics
pipeline_version: 2.0.0
description:
  Mirrors the current MRI Pipeline preset 'FreeSurfer 7 + Volume'. Dependencies use a safe file-level DAG so
  independent stages can be scheduled concurrently when resources allow.
status: draft
metadata:
  validated: false
  source: mri_pipeline_current_presets
  processing_engine: freesurfer7
  feature_set: volumetrics
  pipeline_mode: FreeSurfer 7 + Volume
  default_profile_set: freesurfer7_volumetrics_default
  required_outputs:
    - subcortical_volume
  optional_outputs:
    - intermediate_work_products
  active_pipeline_stages:
    - reorientation
    - brain_extraction
    - segmentation
    - stats_extraction
  skipped_pipeline_stages:
    - template_registration
    - bias_correction
    - white_matter_segmentation
    - surface_reconstruction
    - surface_registration
  stage_options:
    command_template: mri_pipeline_executor
    input_placeholder: "{input}"
    output_placeholder: "{output}"
    workspace_placeholder: "{workspace_id}"
stages:
  - id: reorient_resize
    display_name: Reorientation and Resize
    operation: reorientation_resize
    implementation: fs7_recon_style_reorientation
    implementation_version: 7.4.1
    enabled: true
    depends_on: []
    execution_configurations:
      - id: cpu_1
        mode: cpu
        cpu_threads: 1
        profile_ref: freesurfer7_volumetrics_default_reorient_resize_cpu_1
        metadata:
          executor: cpu
          pipeline_stage: reorientation
          pipeline_tool_key: fs7_recon_style_reorientation
          docker_image: mkdayyyy/mri-fs741:7.4.1-min
          provisional: true
      - id: cpu_2
        mode: cpu
        cpu_threads: 2
        profile_ref: freesurfer7_volumetrics_default_reorient_resize_cpu_2
        metadata:
          executor: cpu
          pipeline_stage: reorientation
          pipeline_tool_key: fs7_recon_style_reorientation
          docker_image: mkdayyyy/mri-fs741:7.4.1-min
          provisional: true
    metadata:
      pipeline_stage: reorientation
      pipeline_tool_key: fs7_recon_style_reorientation
      pipeline_stage_order: 1
      docker_image: mkdayyyy/mri-fs741:7.4.1-min
      needs_license: true
      output_files: []
      output_globs:
        - freesurfer/*/mri/orig.mgz
  - id: brain_extraction
    display_name: Brain Extraction
    operation: brain_extraction
    implementation: fs7_recon_style_brain_extraction
    implementation_version: 7.4.1
    enabled: true
    depends_on:
      - reorient_resize
    execution_configurations:
      - id: cpu_1
        mode: cpu
        cpu_threads: 1
        profile_ref: freesurfer7_volumetrics_default_brain_extraction_cpu_1
        metadata:
          executor: cpu
          pipeline_stage: brain_extraction
          pipeline_tool_key: fs7_recon_style_brain_extraction
          docker_image: mkdayyyy/mri-fs741:7.4.1-min
          provisional: true
      - id: cpu_2
        mode: cpu
        cpu_threads: 2
        profile_ref: freesurfer7_volumetrics_default_brain_extraction_cpu_2
        metadata:
          executor: cpu
          pipeline_stage: brain_extraction
          pipeline_tool_key: fs7_recon_style_brain_extraction
          docker_image: mkdayyyy/mri-fs741:7.4.1-min
          provisional: true
      - id: cpu_4
        mode: cpu
        cpu_threads: 4
        profile_ref: freesurfer7_volumetrics_default_brain_extraction_cpu_4
        metadata:
          executor: cpu
          pipeline_stage: brain_extraction
          pipeline_tool_key: fs7_recon_style_brain_extraction
          docker_image: mkdayyyy/mri-fs741:7.4.1-min
          provisional: true
    metadata:
      pipeline_stage: brain_extraction
      pipeline_tool_key: fs7_recon_style_brain_extraction
      pipeline_stage_order: 2
      docker_image: mkdayyyy/mri-fs741:7.4.1-min
      needs_license: true
      output_files: []
      output_globs:
        - freesurfer/*/mri/brainmask.mgz
  - id: subcortical_segmentation
    display_name: Subcortical Segmentation
    operation: subcortical_segmentation
    implementation: fs7_recon_style_segmentation
    implementation_version: 7.4.1
    enabled: true
    depends_on:
      - brain_extraction
    execution_configurations:
      - id: cpu_1
        mode: cpu
        cpu_threads: 1
        profile_ref: freesurfer7_volumetrics_default_subcortical_segmentation_cpu_1
        metadata:
          executor: cpu
          pipeline_stage: segmentation
          pipeline_tool_key: fs7_recon_style_segmentation
          docker_image: mkdayyyy/mri-fs741:7.4.1-min
          provisional: true
      - id: cpu_2
        mode: cpu
        cpu_threads: 2
        profile_ref: freesurfer7_volumetrics_default_subcortical_segmentation_cpu_2
        metadata:
          executor: cpu
          pipeline_stage: segmentation
          pipeline_tool_key: fs7_recon_style_segmentation
          docker_image: mkdayyyy/mri-fs741:7.4.1-min
          provisional: true
      - id: cpu_4
        mode: cpu
        cpu_threads: 4
        profile_ref: freesurfer7_volumetrics_default_subcortical_segmentation_cpu_4
        metadata:
          executor: cpu
          pipeline_stage: segmentation
          pipeline_tool_key: fs7_recon_style_segmentation
          docker_image: mkdayyyy/mri-fs741:7.4.1-min
          provisional: true
    metadata:
      pipeline_stage: segmentation
      pipeline_tool_key: fs7_recon_style_segmentation
      pipeline_stage_order: 3
      docker_image: mkdayyyy/mri-fs741:7.4.1-min
      needs_license: true
      output_files: []
      output_globs:
        - freesurfer/*/mri/aseg.presurf.mgz
        - freesurfer/*/mri/aseg.auto.mgz
  - id: statistics_atlas_mapping
    display_name: Statistics and Atlas Mapping
    operation: statistics_atlas_mapping
    implementation: fs7_recon_style_subcortical_stats
    implementation_version: 7.4.1
    enabled: true
    depends_on:
      - subcortical_segmentation
    execution_configurations:
      - id: cpu_1
        mode: cpu
        cpu_threads: 1
        profile_ref: freesurfer7_volumetrics_default_statistics_atlas_mapping_cpu_1
        metadata:
          executor: cpu
          pipeline_stage: stats_extraction
          pipeline_tool_key: fs7_recon_style_subcortical_stats
          docker_image: mkdayyyy/mri-fs741:7.4.1-min
          provisional: true
      - id: cpu_2
        mode: cpu
        cpu_threads: 2
        profile_ref: freesurfer7_volumetrics_default_statistics_atlas_mapping_cpu_2
        metadata:
          executor: cpu
          pipeline_stage: stats_extraction
          pipeline_tool_key: fs7_recon_style_subcortical_stats
          docker_image: mkdayyyy/mri-fs741:7.4.1-min
          provisional: true
    metadata:
      pipeline_stage: stats_extraction
      pipeline_tool_key: fs7_recon_style_subcortical_stats
      pipeline_stage_order: 4
      docker_image: mkdayyyy/mri-fs741:7.4.1-min
      needs_license: true
      output_files:
        - aseg.stats
        - subcortical_volume.tsv
      output_globs:
        - freesurfer/*/stats/aseg.stats
        - stats/subcortical_volume.tsv
