schema_version: 1
pipeline_id: freesurfer8_volumetrics
display_name: FreeSurfer 8 - Volumetrics
pipeline_version: 2.0.0
description: Mirrors the current MRI Pipeline preset 'FreeSurfer 8 + Volume'. Dependencies use a safe file-level DAG so
  independent stages can be scheduled concurrently when resources allow.
status: draft
metadata:
  validated: false
  source: mri_pipeline_current_presets
  processing_engine: freesurfer8
  feature_set: volumetrics
  pipeline_mode: FreeSurfer 8 + Volume
  default_profile_set: freesurfer8_volumetrics_default
  required_outputs:
  - cortical_volume
  - subcortical_volume
  optional_outputs:
  - intermediate_work_products
  active_pipeline_stages:
  - reorientation
  - segmentation
  - stats_extraction
  skipped_pipeline_stages:
  - brain_extraction
  - template_registration
  - bias_correction
  - white_matter_segmentation
  - surface_reconstruction
  - surface_registration
  stage_options:
    command_template: mri_pipeline_executor
    input_placeholder: '{input}'
    output_placeholder: '{output}'
    workspace_placeholder: '{workspace_id}'
stages:
- id: reorient_resize
  display_name: Reorientation and Resize
  operation: reorientation_resize
  implementation: fs8_reduced54_reorientation
  implementation_version: 8.0.0
  enabled: true
  depends_on: []
  execution_configurations:
  - id: cpu_1
    mode: cpu
    cpu_threads: 1
    profile_ref: freesurfer8_volumetrics_default_reorient_resize_cpu_1
    metadata:
      executor: cpu
      pipeline_stage: reorientation
      pipeline_tool_key: fs8_reduced54_reorientation
      docker_image: mkdayyyy/mri-fs8-all:latest
      provisional: true
  - id: cpu_2
    mode: cpu
    cpu_threads: 2
    profile_ref: freesurfer8_volumetrics_default_reorient_resize_cpu_2
    metadata:
      executor: cpu
      pipeline_stage: reorientation
      pipeline_tool_key: fs8_reduced54_reorientation
      docker_image: mkdayyyy/mri-fs8-all:latest
      provisional: true
  metadata:
    pipeline_stage: reorientation
    pipeline_tool_key: fs8_reduced54_reorientation
    pipeline_stage_order: 1
    docker_image: mkdayyyy/mri-fs8-all:latest
    needs_license: true
    output_files: []
    output_globs:
    - freesurfer/*/mri/orig.mgz
- id: subcortical_segmentation
  display_name: Subcortical Segmentation
  operation: subcortical_segmentation
  implementation: synthseg_freesurfer_fs8
  implementation_version: 8.0.0
  enabled: true
  depends_on:
  - reorient_resize
  execution_configurations:
  - id: cpu_1
    mode: cpu
    cpu_threads: 1
    profile_ref: freesurfer8_volumetrics_default_subcortical_segmentation_cpu_1
    metadata:
      executor: cpu
      pipeline_stage: segmentation
      pipeline_tool_key: synthseg_freesurfer_fs8
      docker_image: mkdayyyy/mri-fs8-all:latest
      provisional: true
  - id: cpu_2
    mode: cpu
    cpu_threads: 2
    profile_ref: freesurfer8_volumetrics_default_subcortical_segmentation_cpu_2
    metadata:
      executor: cpu
      pipeline_stage: segmentation
      pipeline_tool_key: synthseg_freesurfer_fs8
      docker_image: mkdayyyy/mri-fs8-all:latest
      provisional: true
  - id: cpu_4
    mode: cpu
    cpu_threads: 4
    profile_ref: freesurfer8_volumetrics_default_subcortical_segmentation_cpu_4
    metadata:
      executor: cpu
      pipeline_stage: segmentation
      pipeline_tool_key: synthseg_freesurfer_fs8
      docker_image: mkdayyyy/mri-fs8-all:latest
      provisional: true
  metadata:
    pipeline_stage: segmentation
    pipeline_tool_key: synthseg_freesurfer_fs8
    pipeline_stage_order: 3
    docker_image: mkdayyyy/mri-fs8-all:latest
    needs_license: true
    output_files:
    - 03_freesurfer_synthseg_segmentation.nii.gz
    output_globs:
    - freesurfer/*/mri/synthseg.rca.mgz
    - freesurfer/*/mri/synthseg.vol.csv
- id: statistics_atlas_mapping
  display_name: Statistics and Atlas Mapping
  operation: statistics_atlas_mapping
  implementation: fs8_reduced54_stats
  implementation_version: 8.0.0
  enabled: true
  depends_on:
  - subcortical_segmentation
  execution_configurations:
  - id: cpu_1
    mode: cpu
    cpu_threads: 1
    profile_ref: freesurfer8_volumetrics_default_statistics_atlas_mapping_cpu_1
    metadata:
      executor: cpu
      pipeline_stage: stats_extraction
      pipeline_tool_key: fs8_reduced54_stats
      docker_image: mkdayyyy/mri-fs8-all:latest
      provisional: true
  - id: cpu_2
    mode: cpu
    cpu_threads: 2
    profile_ref: freesurfer8_volumetrics_default_statistics_atlas_mapping_cpu_2
    metadata:
      executor: cpu
      pipeline_stage: stats_extraction
      pipeline_tool_key: fs8_reduced54_stats
      docker_image: mkdayyyy/mri-fs8-all:latest
      provisional: true
  metadata:
    pipeline_stage: stats_extraction
    pipeline_tool_key: fs8_reduced54_stats
    pipeline_stage_order: 9
    docker_image: mkdayyyy/mri-fs8-all:latest
    needs_license: true
    output_files:
    - lh.aparc.stats
    - rh.aparc.stats
    - aseg.stats
    - subcortical_volume.tsv
    - cortical_volume.tsv
    output_globs:
    - freesurfer/*/stats/lh.aparc.stats
    - freesurfer/*/stats/rh.aparc.stats
    - freesurfer/*/stats/aseg.stats
