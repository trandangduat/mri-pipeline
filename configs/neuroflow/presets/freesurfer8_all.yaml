schema_version: 1
pipeline_id: freesurfer8_all
display_name: FreeSurfer 8 - Volume + Cortical Thickness
pipeline_version: 2.0.0
description: Mirrors the current MRI Pipeline preset 'FreeSurfer 8 + Volume + Cortical Thickness'. Dependencies use a safe
  file-level DAG so independent stages can be scheduled concurrently when resources allow.
status: draft
metadata:
  validated: false
  source: mri_pipeline_current_presets
  processing_engine: freesurfer8
  feature_set: all
  pipeline_mode: FreeSurfer 8 + Volume + Cortical Thickness
  default_profile_set: freesurfer8_all_default
  required_outputs:
  - cortical_thickness
  - cortical_volume
  - subcortical_volume
  optional_outputs:
  - intermediate_work_products
  active_pipeline_stages:
  - reorientation
  - brain_extraction
  - segmentation
  - template_registration
  - bias_correction
  - white_matter_segmentation
  - surface_reconstruction
  - surface_registration
  - stats_extraction
  skipped_pipeline_stages: []
  stage_options:
    command_template: mri_pipeline_executor
    input_placeholder: '{input}'
    output_placeholder: '{output}'
    workspace_placeholder: '{workspace_id}'
stages:
- id: reorient_resize
  display_name: Reorientation and Resize
  operation: reorientation_resize
  implementation: fs8_reduced54_reorientation
  implementation_version: 8.0.0
  enabled: true
  depends_on: []
  execution_configurations:
  - id: cpu_1
    mode: cpu
    cpu_threads: 1
    profile_ref: freesurfer8_all_default_reorient_resize_cpu_1
    metadata:
      executor: cpu
      pipeline_stage: reorientation
      pipeline_tool_key: fs8_reduced54_reorientation
      docker_image: mkdayyyy/mri-fs8-all:latest
      provisional: true
  - id: cpu_2
    mode: cpu
    cpu_threads: 2
    profile_ref: freesurfer8_all_default_reorient_resize_cpu_2
    metadata:
      executor: cpu
      pipeline_stage: reorientation
      pipeline_tool_key: fs8_reduced54_reorientation
      docker_image: mkdayyyy/mri-fs8-all:latest
      provisional: true
  metadata:
    pipeline_stage: reorientation
    pipeline_tool_key: fs8_reduced54_reorientation
    pipeline_stage_order: 1
    docker_image: mkdayyyy/mri-fs8-all:latest
    needs_license: true
    output_files: []
    output_globs:
    - freesurfer/*/mri/orig.mgz
